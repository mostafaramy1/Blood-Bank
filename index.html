            }

                background: #cbd5e1;
                border-radius: 9999px;
            }
            ::-webkit-scrollbar-thumb:hover {
                background: #94a3b8;
            }
            @keyframes slideInRight {
                from {
                    transform: translateX(100%);
                    opacity: 0;
                }
                to {
                    transform: translateX(0);
                    opacity: 1;
                }
            }
            .toast-enter {
                animation: slideInRight 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            }

            }

                    danger: '<i data-lucide="alert-octagon" class="w-5 h-5 text-red-600 shrink-0"></i>',
                    warning: '<i data-lucide="alert-triangle" class="w-5 h-5 text-amber-500 shrink-0"></i>',
                    info: '<i data-lucide="info" class="w-5 h-5 text-blue-600 shrink-0"></i>',

                toast.className = `pointer-events-auto toast-enter flex items-start gap-3 p-3.5 rounded-xl shadow-lg border border-slate-200/80 ${styles[type] || styles.info}`;
                toast.innerHTML = `

            function playEmergencyChime(force = false) {
                if (!state.soundAlertEnabled && !force) return;
                try {
                    const AudioCtx = window.AudioContext || window.webkitAudioContext;
                    if (!AudioCtx) return;
                    const ctx = new AudioCtx();
                    const now = ctx.currentTime;
                    [880, 1174.66, 880, 1174.66].forEach((freq, idx) => {
                        const osc = ctx.createOscillator();
                        const gain = ctx.createGain();
                        osc.type = "sine";
                        osc.frequency.setValueAtTime(freq, now + idx * 0.16);
                        gain.gain.setValueAtTime(0.001, now + idx * 0.16);
                        gain.gain.exponentialRampToValueAtTime(0.18, now + idx * 0.16 + 0.025);
                        gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.16 + 0.15);
                        osc.connect(gain);
                        gain.connect(ctx.destination);
                        osc.start(now + idx * 0.16);
                        osc.stop(now + idx * 0.16 + 0.155);
                    });
                } catch (err) {
                    // Ignore autoplay restrictions
                }
            }

            function selectLabUnit(unitId) {

            function handleLabScreening(outcome) {
                const unitIdx = state.pendingUnits.findIndex((u) => u.id === state.selectedLabUnitId);
                if (unitIdx === -1) return;
                const unit = state.pendingUnits[unitIdx];
                const form = document.getElementById("lab-screening-form");
                const fd = new FormData(form);
                const confirmedType = fd.get("confirmedType") || unit.bloodType;
                const hgb = parseFloat(fd.get("hemoglobin")) || 14.0;

                if (outcome === "pass") {
                    const markers = ["hiv", "hbv", "hcv", "syphilis"];
                    const reactive = markers.filter((m) => fd.get(m) === "Reactive");
                    if (reactive.length > 0) {
                        showToast(
                            `Cannot mark Safe: ${reactive.join(", ").toUpperCase()} marked as Reactive!`,
                            "danger",
                        );
                        return;
                    }
                    if (hgb < 12.5) {
                        showToast(
                            `Cannot mark Safe: Hemoglobin (${hgb} g/dL) is below safe 12.5 g/dL threshold.`,
                            "danger",
                        );
                        return;
                    }

                    // Add +1 unit to live inventory
                    const inv = state.inventory[confirmedType];
                    inv.units += 1;
                    inv.nearestExpiry = inv.nearestExpiry === "—" ? formatDateOffset(42) : inv.nearestExpiry;

                    state.screeningHistory.unshift({
                        id: unit.id,
                        donorName: unit.donorName,
                        bloodType: confirmedType,
                        date: formatDateOffset(0),
                        outcome: "Passed",
                        cause: `All markers Non-Reactive (Hgb ${hgb} g/dL)`,
                        technician: state.currentUser.name,
                    });

                    // Update donor history if pending
                    const dh = state.donorHistory.find(
                        (h) => h.donorName === unit.donorName && h.status.includes("Pending"),
                    );
                    if (dh) dh.status = "Passed (Added to Stock)";

                    state.pendingUnits.splice(unitIdx, 1);
                    state.selectedLabUnitId = state.pendingUnits[0] ? state.pendingUnits[0].id : null;

                    addAuditLog(
                        `Lab Tech (${state.currentUser.name})`,
                        "Unit Verified Safe",
                        `${unit.id} (${confirmedType}) passed screening & added (+1) to active inventory.`,
                        "success",
                    );
                    pushNotification(
                        "Inventory Replenished",
                        `Verified ${confirmedType} unit (${unit.id}) added to live stock.`,
                        "success",
                    );
                    showToast(
                        `${unit.id} (${confirmedType}) marked SAFE and added (+1) to active inventory!`,
                        "success",
                    );
                } else {
                    const cause = (fd.get("rejectionCause") || "").trim();
                    if (!cause) {
                        showToast("Please select a Rejection Cause before marking a unit Unsafe.", "warning");
                        return;
                    }

                    state.screeningHistory.unshift({
                        id: unit.id,
                        donorName: unit.donorName,
                        bloodType: confirmedType,
                        date: formatDateOffset(0),
                        outcome: "Disposed",
                        cause,
                        technician: state.currentUser.name,
                    });

                    const dh = state.donorHistory.find(
                        (h) => h.donorName === unit.donorName && h.status.includes("Pending"),
                    );
                    if (dh) dh.status = `Disposed (${cause})`;

                    state.pendingUnits.splice(unitIdx, 1);
                    state.selectedLabUnitId = state.pendingUnits[0] ? state.pendingUnits[0].id : null;

                    addAuditLog(
                        `Lab Tech (${state.currentUser.name})`,
                        "Unit Disposed",
                        `Rejected & disposed ${unit.id} (${confirmedType}). Cause: ${cause}.`,
                        "danger",
                    );
                    showToast(`${unit.id} marked UNSAFE, disposed, and logged.`, "danger");
                }
                render();
            }

                    showToast(
                        `Insufficient ${req.bloodType} stock (${inv.units}u available, ${req.units}u requested).`,

                        `Staff (${state.currentUser.name})`,

                e.preventDefault();

                const targetVal = fd.get("recipient"); // format: "role|label"
                const [toRole, toLabel] = targetVal.split("|");
                const subject = (fd.get("subject") || "").trim();
                const body = (fd.get("body") || "").trim();
                if (!subject || !body) {
                    showToast("Please fill in both subject and message body.", "warning");
                    return;
                }
                state.messages.unshift({
                    id: "MSG-" + Math.floor(10 + Math.random() * 89),
                    from: `${state.currentUser.name} (Staff)`,
                    toRole,
                    toLabel,
                    subject,
                    body,
                    time: "Just now",

                addAuditLog(
                    `Staff (${state.currentUser.name})`,

                    `Sent "${subject}" to ${toLabel}.`,
                    "info",

                pushNotification(`Staff Message to ${toLabel}`, subject, "info");

                const emg = state.emergencyRequests.find((e) => e.id === emgId);

                const inv = state.inventory[emg.bloodType];
                if (inv.units < emg.units) {

            // --- ACTOR 7: ADMIN & EMERGENCY COORDINATOR DEDICATED PAGE ---
            function renderAdminPage() {
                const pendingEmgCount = state.emergencyRequests.filter((e) => e.status !== "Dispatched").length;
                const totalUnits = Object.values(state.inventory).reduce((s, i) => s + i.units, 0);
                const totalAcceptedDonors = state.broadcastAlerts.reduce((s, a) => s + a.acceptedCount, 0);
                const totalDeclinedDonors = state.broadcastAlerts.reduce((s, a) => s + a.declinedCount, 0);

                return `
        <div class="space-y-6">
          <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-4">
            <div>
              <h1 class="text-2xl font-extrabold text-slate-900">Admin & Emergency Coordinator</h1>
              <p class="text-sm text-slate-500 mt-0.5">Priority emergency dispatch, live donor broadcasts, user administration, audit logs & reports.</p>
            </div>
            <div class="flex flex-wrap bg-white p-1.5 rounded-xl border border-slate-200 shadow-2xs gap-1 self-start">
              <button onclick="setAdminTab('emergency')" class="px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1.5 ${state.adminTab === "emergency" ? "bg-red-600 text-white" : "text-slate-600 hover:bg-slate-50"}">
                <i data-lucide="siren" class="w-3.5 h-3.5"></i> Emergency Queue (${pendingEmgCount})
              </button>
              <button onclick="setAdminTab('users')" class="px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1.5 ${state.adminTab === "users" ? "bg-slate-900 text-white" : "text-slate-600 hover:bg-slate-50"}">
                <i data-lucide="users" class="w-3.5 h-3.5"></i> Users & Roles (${state.users.length})
              </button>
              <button onclick="setAdminTab('logs')" class="px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1.5 ${state.adminTab === "logs" ? "bg-slate-900 text-white" : "text-slate-600 hover:bg-slate-50"}">
                <i data-lucide="scroll-text" class="w-3.5 h-3.5"></i> System Logs
              </button>
              <button onclick="setAdminTab('reports')" class="px-3 py-1.5 rounded-lg text-xs font-bold flex items-center gap-1.5 ${state.adminTab === "reports" ? "bg-teal-600 text-white" : "text-slate-600 hover:bg-slate-50"}">
                <i data-lucide="bar-chart-3" class="w-3.5 h-3.5"></i> Analytics
              </button>
            </div>
          </div>

          <!-- TAB 1: EMERGENCY QUEUE -->
          ${
              state.adminTab === "emergency"
                  ? `
            <!-- Visual Alert Banner & Audio Controls -->
            <div class="bg-red-50 border border-red-200 rounded-2xl p-4 sm:p-5 flex flex-col md:flex-row md:items-center justify-between gap-4">
              <div class="flex items-center gap-3.5">
                <div class="w-11 h-11 rounded-xl bg-red-600 text-white flex items-center justify-center shrink-0 pulse-crimson">
                  <i data-lucide="volume-2" class="w-5 h-5"></i>
                </div>
                <div>
                  <p class="text-sm font-extrabold text-red-900">Real-Time Emergency Command Banner</p>
                  <p class="text-xs text-red-700">${pendingEmgCount} active emergency case(s) • Live Donor Responses: <strong class="text-teal-800">${totalAcceptedDonors} Accepted</strong> / ${totalDeclinedDonors} Declined</p>
                </div>
              </div>
              <div class="flex flex-wrap items-center gap-2">
                <button onclick="toggleSoundAlert()" class="px-3 py-2 rounded-xl border text-xs font-bold flex items-center gap-1.5 ${state.soundAlertEnabled ? "bg-white border-red-200 text-red-700" : "bg-slate-100 border-slate-200 text-slate-500"}">
                  <i data-lucide="${state.soundAlertEnabled ? "bell-ring" : "bell-off"}" class="w-3.5 h-3.5"></i>
                  Sound: ${state.soundAlertEnabled ? "ON" : "MUTED"}
                </button>
                <button onclick="testEmergencyAlertSound()" class="px-3.5 py-2 rounded-xl bg-red-600 hover:bg-red-700 text-white text-xs font-bold flex items-center gap-1.5 shadow-xs">
                  <i data-lucide="play" class="w-3.5 h-3.5"></i> Test Alert Sound
                </button>
              </div>
            </div>

            <!-- Emergency Request Cards -->
            <div class="space-y-4">
              ${state.emergencyRequests
                  .map((emg) => {
                      const avail = state.inventory[emg.bloodType].units;
                      const isDispatched = emg.status === "Dispatched";
                      const linkedAlert = state.broadcastAlerts.find((a) => a.emgId === emg.id);
                      return `
                  <div class="bg-white rounded-2xl border-2 ${isDispatched ? "border-teal-200" : "border-red-200"} shadow-xs p-5">
                    <div class="flex flex-col lg:flex-row lg:items-center justify-between gap-4">
                      <div class="space-y-1.5">
                        <div class="flex flex-wrap items-center gap-2">
                          <span class="px-2.5 py-1 rounded-lg bg-red-600 text-white text-xs font-extrabold">${emg.bloodType} × ${emg.units}u</span>
                          <span class="font-extrabold text-slate-900 text-sm">${emg.id} — ${emg.caseType}</span>
                          <span class="px-2.5 py-0.5 rounded-full text-xs font-bold ${isDispatched ? "bg-teal-50 text-teal-700" : "bg-red-50 text-red-700"}">${emg.status}</span>
                          <span class="text-xs text-slate-400">• ${emg.submittedAt}</span>
                        </div>
                        <p class="text-xs font-semibold text-slate-700">${emg.location} • Contact: ${emg.contact} (Filed by ${emg.requesterName})</p>
                        <div class="flex flex-wrap items-center gap-3 text-[11px]">
                          <span class="font-bold ${avail >= emg.units ? "text-teal-700" : "text-red-600"}">Live Stock: ${avail}u of ${emg.bloodType}</span>
                          ${linkedAlert ? `<span class="px-2 py-0.5 rounded bg-teal-50 text-teal-800 font-bold">Donor Broadcast: ${linkedAlert.acceptedCount} Accepted • ${linkedAlert.declinedCount} Declined</span>` : ""}
                        </div>
                      </div>

                      <div class="flex flex-wrap items-center gap-2 shrink-0">
                        <button onclick="inspectEmergencyProof('${emg.id}')" class="px-3.5 py-2 rounded-xl border border-slate-200 hover:bg-slate-50 text-slate-700 text-xs font-bold flex items-center gap-1.5">
                          <i data-lucide="file-search" class="w-4 h-4 text-blue-600"></i> Inspect Proof
                        </button>
                        ${
                            !isDispatched
                                ? `
                          <button onclick="verifyAndDispatchEmergency('${emg.id}')" class="px-3.5 py-2 rounded-xl bg-teal-600 hover:bg-teal-700 text-white text-xs font-bold flex items-center gap-1.5 shadow-xs">
                            <i data-lucide="truck" class="w-4 h-4"></i> Verify & Dispatch Blood
                          </button>
                          <button onclick="broadcastAlertToDonors('${emg.id}')" class="px-3.5 py-2 rounded-xl bg-red-600 hover:bg-red-700 text-white text-xs font-bold flex items-center gap-1.5 shadow-xs">
                            <i data-lucide="radio" class="w-4 h-4"></i> Broadcast Alert to Donors
                          </button>
                        `
                                : `
                          <span class="inline-flex items-center gap-1 text-xs font-bold text-teal-700 bg-teal-50 px-3 py-2 rounded-xl">
                            <i data-lucide="check-circle-2" class="w-4 h-4"></i> Dispatched
                          </span>
                        `
                        }
                      </div>
                    </div>
                  </div>
                `;
                  })
                  .join("")}
            </div>
          `
                  : ""
          }

          <!-- TAB 2: USERS & ROLES -->
          ${
              state.adminTab === "users"
                  ? `
            <div class="bg-white rounded-2xl border border-slate-200 shadow-xs p-6">
              <h2 class="text-base font-bold text-slate-900 mb-1">Registered Users & Role Permissions</h2>
              <p class="text-xs text-slate-500 mb-4">Includes all pre-populated actors and any new accounts registered on the Login/Register page.</p>
              <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                  <thead>
                    <tr class="border-b border-slate-200 text-[11px] font-bold uppercase text-slate-400">
                      <th class="py-2 pr-3">User</th>
                      <th class="py-2 px-3">Assigned Actor Role</th>
                      <th class="py-2 px-3">Blood Group</th>
                      <th class="py-2 px-3">Status</th>
                      <th class="py-2 pl-3 text-right">Action</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-100 text-xs">
                    ${state.users
                        .map(
                            (u) => `
                      <tr class="hover:bg-slate-50/70">
                        <td class="py-3 pr-3">
                          <p class="font-bold text-slate-900">${u.name}</p>
                          <p class="text-[11px] text-slate-400">${u.email}</p>
                        </td>
                        <td class="py-3 px-3">
                          <select onchange="updateUserRole('${u.id}', this.value)" class="rounded-lg border border-slate-200 px-2.5 py-1 text-xs font-bold bg-white">
                            ${Object.values(ACTORS)
                                .map(
                                    (a) =>
                                        `<option value="${a.id}" ${a.id === u.role ? "selected" : ""}>${a.name}</option>`,
                                )
                                .join("")}
                          </select>
                        </td>
                        <td class="py-3 px-3 font-bold text-slate-700">${u.bloodType || "—"}</td>
                        <td class="py-3 px-3">
                          <span class="px-2.5 py-0.5 rounded-full font-bold ${u.status === "Active" ? "bg-teal-50 text-teal-700" : "bg-red-50 text-red-700"}">${u.status}</span>
                        </td>
                        <td class="py-3 pl-3 text-right">
                          <button onclick="toggleUserStatus('${u.id}')" class="px-3 py-1 rounded-lg border border-slate-200 hover:bg-slate-100 text-slate-700 font-bold">
                            ${u.status === "Active" ? "Suspend" : "Activate"}
                          </button>
                        </td>
                      </tr>
                    `,
                        )
                        .join("")}
                  </tbody>
                </table>
              </div>
            </div>
          `
                  : ""
          }

          <!-- TAB 3: SYSTEM LOGS -->
          ${
              state.adminTab === "logs"
                  ? `
            <div class="bg-white rounded-2xl border border-slate-200 shadow-xs p-6">
              <h2 class="text-base font-bold text-slate-900 mb-1">System Audit Trail</h2>
              <p class="text-xs text-slate-500 mb-4">Timestamped log of every action across all 7 Actor portals.</p>
              <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                  <thead>
                    <tr class="border-b border-slate-200 text-[11px] font-bold uppercase text-slate-400">
                      <th class="py-2 pr-3">Time</th>
                      <th class="py-2 px-3">Actor</th>
                      <th class="py-2 px-3">Action</th>
                      <th class="py-2 pl-3">Details</th>
                    </tr>
                  </thead>
                  <tbody class="divide-y divide-slate-100 text-xs">
                    ${state.auditLogs
                        .map((log) => {
                            const dot =
                                log.severity === "danger"
                                    ? "bg-red-500"
                                    : log.severity === "success"
                                      ? "bg-teal-500"
                                      : log.severity === "warning"
                                        ? "bg-amber-500"
                                        : "bg-blue-500";
                            return `
                        <tr class="hover:bg-slate-50/70">
                          <td class="py-3 pr-3 font-mono text-[11px] text-slate-500 whitespace-nowrap">${log.time}</td>
                          <td class="py-3 px-3 font-semibold text-slate-800 whitespace-nowrap">${log.actor}</td>
                          <td class="py-3 px-3 whitespace-nowrap font-bold text-slate-900"><span class="inline-block w-2 h-2 rounded-full ${dot} mr-1.5"></span>${log.action}</td>
                          <td class="py-3 pl-3 text-slate-600">${log.details}</td>
                        </tr>
                      `;
                        })
                        .join("")}
                  </tbody>
                </table>
              </div>
            </div>
          `
                  : ""
          }

          <!-- TAB 4: ANALYTICS & REPORTS (CHART.JS) -->
          ${
              state.adminTab === "reports"
                  ? `
            <div class="grid grid-cols-2 lg:grid-cols-4 gap-4">
              <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-2xs">
                <span class="text-xs font-semibold text-slate-500">Total Active Stock</span>
                <p class="text-3xl font-extrabold text-teal-700 mt-1">${totalUnits}</p>
                <span class="text-[11px] text-slate-400">Units across 8 types</span>
              </div>
              <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-2xs">
                <span class="text-xs font-semibold text-slate-500">Registered Users</span>
                <p class="text-3xl font-extrabold text-slate-900 mt-1">${state.users.length}</p>
                <span class="text-[11px] text-teal-600 font-semibold">7 Actor Roles</span>
              </div>
              <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-2xs">
                <span class="text-xs font-semibold text-slate-500">Routine Requests</span>
                <p class="text-3xl font-extrabold text-slate-900 mt-1">${state.routineRequests.length}</p>
                <span class="text-[11px] text-slate-400">Patient & Hospital</span>
              </div>
              <div class="bg-white rounded-2xl border border-slate-200 p-5 shadow-2xs">
                <span class="text-xs font-semibold text-slate-500">Emergency Cases</span>
                <p class="text-3xl font-extrabold text-red-600 mt-1">${state.emergencyRequests.length}</p>
                <span class="text-[11px] text-slate-400">Code Crimson tracker</span>
              </div>
            </div>

            <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
              <div class="lg:col-span-7 bg-white rounded-2xl border border-slate-200 p-6 shadow-xs">
                <h3 class="text-sm font-bold text-slate-900 mb-4">Live Blood Inventory by Blood Type (Units)</h3>
                <div class="h-64 relative"><canvas id="chart-inventory"></canvas></div>
              </div>
              <div class="lg:col-span-5 bg-white rounded-2xl border border-slate-200 p-6 shadow-xs">
                <h3 class="text-sm font-bold text-slate-900 mb-4">Lab Safety Screening (Passed vs. Disposed)</h3>
                <div class="h-64 relative flex items-center justify-center"><canvas id="chart-screening"></canvas></div>
              </div>
              <div class="lg:col-span-12 bg-white rounded-2xl border border-slate-200 p-6 shadow-xs">
                <h3 class="text-sm font-bold text-slate-900 mb-4">Monthly Donations vs. Blood Requests</h3>
                <div class="h-64 relative"><canvas id="chart-trends"></canvas></div>
              </div>
            </div>
          `
                  : ""
          }
        </div>
      `;
            }

            /* =========================================================================
       9. CHART.JS ANALYTICS ENGINE
       ========================================================================= */
            function destroyActiveCharts() {
                state.activeCharts.forEach((c) => {
                    try {
                        c.destroy();
                    } catch (e) {}
                });
                state.activeCharts = [];
            }

            function initAdminCharts() {
                destroyActiveCharts();
                if (state.view !== "dashboard" || state.selectedRole !== "admin" || state.adminTab !== "reports")
                    return;

                const invCanvas = document.getElementById("chart-inventory");
                const scrCanvas = document.getElementById("chart-screening");
                const trdCanvas = document.getElementById("chart-trends");
                if (!invCanvas || !scrCanvas || !trdCanvas) return;

                const invValues = BLOOD_TYPES.map((bt) => state.inventory[bt].units);
                const invColors = invValues.map((v) => (v <= 2 ? "#DC2626" : v <= 6 ? "#F59E0B" : "#0D9488"));
                state.activeCharts.push(
                    new Chart(invCanvas, {
                        type: "bar",
                        data: {
                            labels: BLOOD_TYPES,
                            datasets: [
                                {
                                    label: "Units Available",
                                    data: invValues,
                                    backgroundColor: invColors,
                                    borderRadius: 8,
                                },
                            ],
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: { legend: { display: false } },
                            scales: {
                                y: { beginAtZero: true, grid: { color: "#F1F5F9" } },
                                x: { grid: { display: false } },
                            },
                        },
                    }),
                );

                const passedTotal =
                    state.passedUnitsBaseline + state.screeningHistory.filter((s) => s.outcome === "Passed").length;
                const disposedTotal = state.screeningHistory.filter((s) => s.outcome === "Disposed").length;
                state.activeCharts.push(
                    new Chart(scrCanvas, {
                        type: "doughnut",
                        data: {
                            labels: ["Passed (Verified Safe)", "Disposed (Failed)"],
                            datasets: [
                                {
                                    data: [passedTotal, disposedTotal],
                                    backgroundColor: ["#0D9488", "#DC2626"],
                                    borderWidth: 0,
                                },
                            ],
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            cutout: "66%",
                            plugins: { legend: { position: "bottom" } },
                        },
                    }),
                );

                state.activeCharts.push(
                    new Chart(trdCanvas, {
                        type: "line",
                        data: {
                            labels: ["Jun", "Jul", "Aug", "Sep", "Oct", "Nov (Live)"],
                            datasets: [
                                {
                                    label: "Donations Collected",
                                    data: [110, 126, 121, 138, 134, passedTotal],
                                    borderColor: "#0D9488",
                                    backgroundColor: "rgba(13, 148, 136, 0.1)",
                                    fill: true,
                                    tension: 0.35,
                                },
                                {
                                    label: "Blood Requests",
                                    data: [
                                        96,
                                        114,
                                        119,
                                        127,
                                        130,
                                        122 + state.routineRequests.length + state.emergencyRequests.length,
                                    ],
                                    borderColor: "#DC2626",
                                    backgroundColor: "rgba(220, 38, 38, 0.06)",
                                    fill: true,
                                    tension: 0.35,
                                },
                            ],
                        },
                        options: {
                            responsive: true,
                            maintainAspectRatio: false,
                            plugins: { legend: { position: "top" } },
                            scales: {
                                y: { beginAtZero: false, grid: { color: "#F1F5F9" } },
                                x: { grid: { display: false } },
                            },
                        },
                    }),
                );
            }

            /* =========================================================================
       10. MASTER RENDER ROUTER
       ========================================================================= */
            function render() {
                const app = document.getElementById("app");

                if (state.view === "auth") {
                    app.innerHTML = renderAuthLandingPage();
                } else {
                    let pageHtml = "";
                    switch (state.selectedRole) {
                        case "patient":
                            pageHtml = renderPatientPage();
                            break;
                        case "hospital":
                            pageHtml = renderHospitalPage();
                            break;
                        case "emergency":
                            pageHtml = renderEmergencyRequesterPage();
                            break;
                        case "donor":
                            pageHtml = renderDonorPage();
                            break;
                        case "lab":
                            pageHtml = renderLabTechPage();
                            break;
                        case "staff":
                            pageHtml = renderStaffPage();
                            break;
                        case "admin":
                            pageHtml = renderAdminPage();
                            break;
                    }
                    app.innerHTML = `
          ${renderNavbar()}
          <main class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 sm:py-8">
            ${pageHtml}
          </main>
        `;
                }

                lucide.createIcons();

                if (state.view === "dashboard" && state.selectedRole === "admin" && state.adminTab === "reports") {
                    setTimeout(initAdminCharts, 0);
                }
            }

            // Backdrop click closes custom modal
            document.getElementById("modal-root").addEventListener("click", (e) => {
                if (e.target.id === "modal-root") closeModal();
            });

            // Boot directly into Unified Login/Register + Actor Selection First Page
            window.addEventListener("DOMContentLoaded", render);
        </script>
    </body>
</html>
